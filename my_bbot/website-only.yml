description: >-
  Website-only scan: probes exactly the website origins it is seeded with and nothing around them, with no DNS,
  address, port or third-party discovery. Set modules.website_origin_policy.website_origins to the seeded origins.

modules:
  - website_origin_policy
  - offchain_scope_filter
  - httpx
  - whatweb
  - retirejs
  - badsecrets
  - wafw00f

output_modules:
  - sqlite

config:
  omit_event_types:
    - RAW_TEXT
    - FILESYSTEM
    - WEB_PARAMETER
    - DNS_NAME
    - DNS_NAME_UNRESOLVED
    - RAW_DNS_RECORD
    - IP_ADDRESS
    - IP_RANGE
    - OPEN_TCP_PORT
    - OPEN_UDP_PORT
    - TLS_CERTIFICATE
  scope:
    strict: true
    search_distance: 0
    report_distance: 0
  dns:
    minimal: true
    search_distance: 0
    emit_out_of_scope_children: false
    emit_unresolved: false
  interactsh_disable: true
  # Internal modules that would turn a website into hosts, addresses or ports.
  aggregate: false
  cloudcheck: false
  speculate: false
  modules:
    website_origin_policy:
      website_origins: []
    httpx:
      threads: 10
      in_scope_only: true
      max_response_size: 1048576
      store_responses: false
      probe_all_ips: false
      probe_dns_names: true
    retirejs:
      severity: low
    wafw00f:
      find_all: true
