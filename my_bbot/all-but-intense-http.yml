description: Generic discovery preset excluding deep/intense URL-internal probing modules

module_dirs:
  - /workspace/bbot-guardian/my_bbot/modules

modules:
  - apkeep
  - azure_tenant
  - badsecrets
  - bucket_amazon
  - bucket_digitalocean
  - bucket_file_enum
  - bucket_firebase
  - bucket_google
  - bucket_microsoft
  - certspotter
  - chaos
  - code_repository
  - crt
  - crt_db
  - dehashed
  - domain_whois
  - dnscommonsrv
  - dnsbrute
  - dnsbrute_mutations
  - dnsdumpster
  - offchain_scope_filter
  - domain_config_dns_audit
  - domain_phishing
  - docker_pull
  - extractous
  - filedownload
  - fingerprintx
  - gitdumper
  - github_org
  - github_workflows
  - gitlab_com
  - gitleaks
  - google_playstore
  - httpx
  - host_reputation
  - hunterio
  - ip_privacy
  - ipwhois
  - ipstack
  - jadx
  - kingfisher
  - leakix
  - leaklookup
  - leaklookup_hash
  - medusa
  - naabu
  - naabu_fast
  - newsletters
  - noseyparker
  - nuclei
  - nuclei_takeover
  - otx
  - rapiddns
  - securitytrails
  - shodan_dns
  - shodan_idb
  - social
  - sslcert
  - subfinder
  - subzy
  - thc_rdns
  - tcp_connect_verify
  - udpx
  - trufflehog
  - urlscan
  - virustotal
  - wafw00f
  - wayback
  - dnsreaper

output_modules:
  - sqlite

config:
  omit_event_types:
    - RAW_TEXT
    - FILESYSTEM
    - WEB_PARAMETER
  dns:
    emit_out_of_scope_children: false
    emit_unresolved: false
    max_unresolved_subdomains_per_module: 50
    threads: 150
  interactsh_disable: true
  modules:
    stdout:
      accept_dupes: true
    nuclei:
      mode: technology
      tags: ""
      templates: ""
      mobile_template_sources: /workspace/bbot-guardian/my_bbot/mobile-nuclei-templates
      mobile_download_enabled: false
      severity: "critical,high,medium"
      etags: "dos,fuzz,fuzzing,intrusive,destructive"
      exclude_types: "code,headless,javascript,tcp"
      ratelimit: 120
      concurrency: 20
      bulk_size: 10
      retries: 0
      timeout: 5
      batch_size: 50
      module_timeout: 900
      verbose_templates: true
      directory_only: true
      silent: true
    fingerprintx:
      batch_size: 1
      module_threads: 64
      skip_common_web: false
      timeout_ms: 1000
      fast: false
    nuclei_takeover:
      ratelimit: 30
      concurrency: 5
      retries: 0
      timeout: 8
      module_timeout: 180
      check_unresolved: false
      silent: true
    naabu:
      ports: ''
      top_ports: 1000
      rate: 2500
      threads: 200
      scan_type: c
      retries: 1
      timeout_ms: 1500
      process_timeout_multiplier: 3
      process_timeout_grace: 30
      exclude_cdn: false
      scan_all_ips: false
      verify: false
      max_expanded_ip_range_hosts: 4096
      expand_ip_ranges: false
      port_chunk_size: 0
      scan_passes: 1
      scan_individual_targets: true
      target_concurrency: 8
    naabu_fast:
      ports: 1-10000
      rate: 6000
      threads: 200
      scan_type: c
      retries: 1
      timeout_ms: 800
      process_timeout_multiplier: 2
      process_timeout_grace: 30
      exclude_cdn: false
      scan_all_ips: false
      verify: false
      port_chunk_size: 0
      scan_passes: 1
      scan_individual_targets: true
      target_concurrency: 8

    udpx:
      concurrency: 64
      target_concurrency: 2
      target_batch_size: 256
      timeout_ms: 750
      capture_banner: true
    tcp_connect_verify:
      ports: ''
      top_ports: 1000
      connect_concurrency: 100
      target_concurrency: 8
      global_connect_concurrency: 400
      timeout_ms: 500
      retries: 1
    bucket_amazon:
      permutations: true
      max_candidates: 500
      permutation_numbers: 0
      expand_found_buckets: false
    bucket_digitalocean:
      permutations: true
      max_candidates: 500
      permutation_numbers: 0
      expand_found_buckets: false
    bucket_firebase:
      permutations: true
      max_candidates: 500
      permutation_numbers: 0
      expand_found_buckets: false
    bucket_google:
      permutations: true
      max_candidates: 500
      permutation_numbers: 0
      expand_found_buckets: false
    bucket_microsoft:
      permutations: true
      max_candidates: 500
      permutation_numbers: 0
      expand_found_buckets: false
    dnsbrute:
      wordlist: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt
      max_depth: 3
    dnsbrute_mutations:
      max_mutations: 5000
    speculate:
      unresolved_parent_domains: false
    dnsreaper:
      parallelism: 20
      disable_probable: false
      enable_unlikely: false
      check_unresolved: false
    subzy:
      concurrency: 20
      timeout: 8
      https: true
      verify_ssl: false
      check_unresolved: false
    gowitness:
      threads: 4
      timeout: 7
      resolution_x: 1280
      resolution_y: 720
      social: false
      idle_timeout: 600
    httpx:
      threads: 10
      in_scope_only: true
      max_response_size: 1048576
      store_responses: false
      probe_all_ips: false
    host_reputation:
      abuseipdb_api_key: ${env:ABUSEIPDB_KEY,${env:ABUSEIPDB_API_KEY,""}}
      virustotal_api_keys: ${env:VT_KEY_1,""},${env:VT_KEY_2,""},${env:VT_KEY_3,""},${env:VT_KEY_4,""}
      otx_api_key: ${env:OTX_KEY,${env:OTX_API_KEY,""}}
    jadx:
      threads: 1
    thc_rdns:
      limit: 20
      max_pages: 1
    github_codesearch:
      api_key: ${env:BBOT_WORLD_GITHUB_TOKEN,${env:BBOT_GITHUB_TOKEN,${env:GH_TOKEN,${env:GITHUB_TOKEN,${env:GITHUB_API_KEY,""}}}}}
      limit: 10
    git_clone:
      api_key: ${env:BBOT_WORLD_GITHUB_TOKEN,${env:BBOT_GITHUB_TOKEN,${env:GH_TOKEN,${env:GITHUB_TOKEN,${env:GITHUB_API_KEY,""}}}}}
    trufflehog:
      only_verified: true
      concurrency: 4
      deleted_forks: false
    chaos:
      api_key: ${env:CHAOS_API_KEY,""}
    cloudcheck:
      scope_input_only: true
    dehashed:
      api_key: ${env:DEHASHED_API_KEY,""}
    github_org:
      api_key: ${env:BBOT_WORLD_GITHUB_TOKEN,${env:BBOT_GITHUB_TOKEN,${env:GH_TOKEN,${env:GITHUB_TOKEN,${env:GITHUB_API_KEY,""}}}}}
    github_workflows:
      api_key: ${env:BBOT_WORLD_GITHUB_TOKEN,${env:BBOT_GITHUB_TOKEN,${env:GH_TOKEN,${env:GITHUB_TOKEN,${env:GITHUB_API_KEY,""}}}}}
    gitlab_com:
      api_key: ${env:BBOT_WORLD_GITLAB_TOKEN,${env:BBOT_GITLAB_TOKEN,${env:GITLAB_TOKEN,${env:GITLAB_API_KEY,""}}}}
    hunterio:
      api_key: ${env:HUNTERIO_API_KEY,""}
    ip_privacy:
      tor_urls:
        - https://check.torproject.org/torbulkexitlist
        - https://opendbl.net/tor-exit.list
        - https://raw.githubusercontent.com/alireza-rezaee/tor-nodes/master/tor_exit_nodes_ip.txt
      proxy_urls:
        - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_proxies.netset
        - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_anonymous.netset
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt
        - https://raw.githubusercontent.com/iplocate/free-proxy-list/main/all-proxies.txt
      vpn_urls:
        - https://raw.githubusercontent.com/X4BNet/lists_vpn/master/output/vpn/ipv4.txt
        - https://raw.githubusercontent.com/NazgulCoder/IPLists/main/vpn/ipv4.txt
        - https://raw.githubusercontent.com/az0/vpn_ip/master/ip.txt
        - https://raw.githubusercontent.com/TN3W/ProtonVPN-IPs/main/protonvpn_ips.txt
        - https://raw.githubusercontent.com/TN3W/Windscribe-IPs/main/windscribe_ips.txt
      cache_for: 86400
    ipstack:
      api_key: ${env:IPSTACK_API_KEY,""}
    leakix:
      api_key: ${env:LEAKIX_API_KEY,""}
    leaklookup:
      api_key: ${env:LEAKLOOKUP_API_KEY,""}
    leaklookup_hash:
      api_key: ${env:LEAKLOOKUP_API_KEY,""}
    otx:
      api_key: ${env:OTX_API_KEY,${env:OTX_KEY,""}}
    securitytrails:
      api_key: ${env:SECURITYTRAILS_API_KEY,""}
    shodan_idb:
      api_key: ${env:SHODAN_API_KEY,${env:SHODAN_DNS_API_KEY,""}}
      full_host: true
    shodan_dns:
      api_key: ${env:SHODAN_API_KEY,${env:SHODAN_DNS_API_KEY,""}}
    subfinder:
      all: true
      recursive: false
      collect_sources: true
      exclude_sources: anubis,thc
      timeout: 45
      max_time: 30
      rate_limit: 0
    virustotal:
      api_key: ${env:VT_KEY_1,""}
