description: Generic discovery preset excluding deep/intense URL-internal probing modules

modules:
  - apkpure
  - azure_tenant
  - badsecrets
  - bucket_amazon
  - bucket_digitalocean
  - bucket_file_enum
  - bucket_firebase
  - bucket_google
  - bucket_microsoft
  - certspotter
  - chaos
  - code_repository
  - crt
  - crt_db
  - dehashed
  - domain_whois
  - dnscommonsrv
  - dnsbrute
  - dnsbrute_mutations
  - dnsdumpster
  - domain_config_dns_audit
  - domain_phishing
  - docker_pull
  - extractous
  - filedownload
  - fingerprintx
  - gitdumper
  - github_workflows
  - gitlab_com
  - gitleaks
  - google_playstore
  - httpx
  - host_reputation
  - hunterio
  - ip_privacy
  - ipwhois
  - ipstack
  - jadx
  - kingfisher
  - leakix
  - leaklookup
  - leaklookup_hash
  - medusa
  - naabu
  - naabu_fast
  - newsletters
  - noseyparker
  - nuclei
  - nuclei_takeover
  - otx
  - rapiddns
  - securitytrails
  - shodan_dns
  - shodan_idb
  - social
  - sslcert
  - subfinder
  - subzy
  - thc_rdns
  - tcp_connect_verify
  - udpx
  - trufflehog
  - urlscan
  - virustotal
  - wafw00f
  - wayback
  - dnsreaper

output_modules:
  - sqlite

config:
  interactsh_disable: true
  modules:
    nuclei:
      mode: technology
      tags: ""
      templates: ""
      mobile_template_sources: /workspace/bbot-guardian/my_bbot/mobile-nuclei-templates
      severity: "critical,high,medium"
      etags: "dos,fuzz,fuzzing,intrusive,destructive"
      exclude_types: "code,headless,javascript,tcp"
      ratelimit: 120
      concurrency: 20
      bulk_size: 10
      retries: 0
      timeout: 5
      batch_size: 50
      module_timeout: 900
      verbose_templates: true
      directory_only: true
      silent: true
    fingerprintx:
      batch_size: 5
      module_threads: 32
      skip_common_web: false
      timeout_ms: 1000
      fast: false
    nuclei_takeover:
      ratelimit: 30
      concurrency: 5
      retries: 0
      timeout: 8
      silent: true
    naabu:
      ports: ''
      top_ports: 1000
      rate: 1200
      threads: 200
      scan_type: c
      retries: 3
      timeout_ms: 3000
      process_timeout_multiplier: 4
      process_timeout_grace: 60
      exclude_cdn: false
      scan_all_ips: false
      expand_ip_ranges: true
      max_expanded_ip_range_hosts: 4096
      port_chunk_size: 0
      scan_passes: 1
      scan_individual_targets: true
      target_concurrency: 1
    naabu_fast:
      ports: 1-10000
      rate: 1200
      threads: 200
      scan_type: c
      retries: 3
      timeout_ms: 3000
      process_timeout_multiplier: 4

    udpx:
      concurrency: 64
      timeout_ms: 750
      capture_banner: true
      process_timeout_grace: 60
      exclude_cdn: false
      scan_all_ips: false
      verify: false
      port_chunk_size: 0
      scan_passes: 1
      scan_individual_targets: true
      target_concurrency: 1
    tcp_connect_verify:
      ports: ''
      top_ports: 1000
      connect_concurrency: 50
      target_concurrency: 4
      timeout_ms: 500
      retries: 1
    dnsbrute:
      wordlist: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt
      max_depth: 3
    dnsbrute_mutations:
      max_mutations: 5000
    dnsreaper:
      parallelism: 20
      disable_probable: false
      enable_unlikely: false
    subzy:
      concurrency: 20
      timeout: 8
      https: true
      verify_ssl: false
    gowitness:
      threads: 4
      timeout: 7
      resolution_x: 1280
      resolution_y: 720
      social: false
      idle_timeout: 600
    httpx:
      threads: 10
      in_scope_only: true
      max_response_size: 1048576
      store_responses: false
      probe_all_ips: false
    host_reputation:
      abuseipdb_api_key: ${env:ABUSEIPDB_KEY}
      virustotal_api_keys: ${env:VT_KEY_1},${env:VT_KEY_2},${env:VT_KEY_3},${env:VT_KEY_4}
      otx_api_key: ${env:OTX_KEY}
    jadx:
      threads: 1
    thc_rdns:
      limit: 20
      max_pages: 1
    trufflehog:
      only_verified: false
      concurrency: 4
      deleted_forks: false
    chaos:
      api_key: ${env:CHAOS_API_KEY}
    dehashed:
      api_key: ${env:DEHASHED_API_KEY}
    github_org:
      api_key: ${env:GITHUB_ORG_API_KEY}
    github_workflows:
      api_key: ${env:GITHUB_WORKFLOWS_API_KEY}
    gitlab_com:
      api_key: ${env:GITLAB_COM_API_KEY}
    hunterio:
      api_key: ${env:HUNTERIO_API_KEY}
    ip_privacy:
      tor_urls:
        - https://check.torproject.org/torbulkexitlist
        - https://opendbl.net/tor-exit.list
        - https://raw.githubusercontent.com/alireza-rezaee/tor-nodes/master/tor_exit_nodes_ip.txt
      proxy_urls:
        - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_proxies.netset
        - https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_anonymous.netset
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt
        - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt
        - https://raw.githubusercontent.com/iplocate/free-proxy-list/main/all-proxies.txt
      vpn_urls:
        - https://raw.githubusercontent.com/X4BNet/lists_vpn/master/output/vpn/ipv4.txt
        - https://raw.githubusercontent.com/NazgulCoder/IPLists/main/vpn/ipv4.txt
        - https://raw.githubusercontent.com/az0/vpn_ip/master/ip.txt
        - https://raw.githubusercontent.com/TN3W/ProtonVPN-IPs/main/protonvpn_ips.txt
        - https://raw.githubusercontent.com/TN3W/Windscribe-IPs/main/windscribe_ips.txt
      cache_for: 86400
    ipstack:
      api_key: ${env:IPSTACK_API_KEY}
    leaklookup:
      api_key: ${env:LEAKLOOKUP_API_KEY}
    otx:
      api_key: ${env:OTX_API_KEY}
    securitytrails:
      api_key: ${env:SECURITYTRAILS_API_KEY}
    shodan_idb:
      api_key: ${env:SHODAN_API_KEY}
      full_host: true
    shodan_dns:
      api_key: ${env:SHODAN_API_KEY}
    subfinder:
      all: true
      recursive: false
      collect_sources: true
      timeout: 45
      max_time: 30
      rate_limit: 0
    virustotal:
      api_key: ${env:VT_KEY_1}
