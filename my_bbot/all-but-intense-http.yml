description: Generic discovery preset excluding deep/intense URL-internal probing modules

modules:
  - apkpure
  - azure_tenant
  - badsecrets
  - bucket_amazon
  - bucket_digitalocean
  - bucket_file_enum
  - bucket_firebase
  - bucket_google
  - bucket_microsoft
  - certspotter
  - chaos
  - code_repository
  - crt
  - crt_db
  - dehashed
  - dnscaa
  - dnscommonsrv
  - dnsbrute
  - dnsbrute_mutations
  - dnsdumpster
  - domain_config_dns_audit
  - domain_phishing
  - docker_pull
  - extractous
  - filedownload
  - fingerprintx
  - gitdumper
  - github_workflows
  - gitlab_com
  - gitleaks
  - google_playstore
  - httpx
  - host_reputation
  - hunterio
  - ipwhois
  - ipstack
  - jadx
  - kingfisher
  - leakix
  - leaklookup
  - leaklookup_hash
  - medusa
  - naabu
  - newsletters
  - noseyparker
  - nuclei
  - nuclei_takeover
  - otx
  - rapiddns
  - securitytrails
  - shodan_dns
  - shodan_idb
  - social
  - sslcert
  - subfinder
  - subzy
  - thc_rdns
  - trufflehog
  - urlscan
  - virustotal
  - wafw00f
  - wayback
  - dnsreaper

output_modules:
  - sqlite

config:
  modules:
    nuclei:
      mode: manual
      tags: ""
      templates: ""
      severity: ""
      etags: ""
      ratelimit: 30
      concurrency: 5
      retries: 1
      batch_size: 400
      directory_only: false
      silent: true
    nuclei_takeover:
      ratelimit: 30
      concurrency: 5
      retries: 0
      timeout: 8
      silent: true
    naabu:
      ports: ''
      top_ports: 1000
      rate: 1200
      threads: 200
      scan_type: c
      retries: 3
      timeout_ms: 3000
      process_timeout_multiplier: 4
      process_timeout_grace: 60
      exclude_cdn: false
      scan_all_ips: false
      expand_ip_ranges: true
      max_expanded_ip_range_hosts: 4096
    dnsbrute:
      wordlist: https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt
      max_depth: 3
    dnsbrute_mutations:
      max_mutations: 5000
    dnsreaper:
      parallelism: 20
      disable_probable: false
      enable_unlikely: false
    subzy:
      concurrency: 20
      timeout: 8
      https: true
      verify_ssl: false
    gowitness:
      threads: 4
      timeout: 7
      resolution_x: 1280
      resolution_y: 720
      social: false
      idle_timeout: 600
    httpx:
      threads: 10
      in_scope_only: true
      max_response_size: 1048576
      store_responses: false
      probe_all_ips: false
    host_reputation:
      abuseipdb_api_key: ${env:ABUSEIPDB_KEY}
      virustotal_api_keys: ${env:VT_KEY},${env:VT_KEY_1},${env:VT_KEY_2},${env:VT_KEY_3},${env:VT_KEY_4}
      otx_api_key: ${env:OTX_KEY}
    jadx:
      threads: 1
    thc_rdns:
      limit: 20
      max_pages: 1
    trufflehog:
      only_verified: false
      concurrency: 4
      deleted_forks: false
    chaos:
      api_key: ${env:CHAOS_API_KEY}
    dehashed:
      api_key: ${env:DEHASHED_API_KEY}
    github_org:
      api_key: ${env:GITHUB_ORG_API_KEY}
    github_workflows:
      api_key: ${env:GITHUB_WORKFLOWS_API_KEY}
    gitlab_com:
      api_key: ${env:GITLAB_COM_API_KEY}
    hunterio:
      api_key: ${env:HUNTERIO_API_KEY}
    ipstack:
      api_key: ${env:IPSTACK_API_KEY}
    leaklookup:
      api_key: ${env:LEAKLOOKUP_API_KEY}
    leaklookup_hash:
      api_key: ${env:LEAKLOOKUP_API_KEY}
    otx:
      api_key: ${env:OTX_API_KEY}
    securitytrails:
      api_key: ${env:SECURITYTRAILS_API_KEY}
    shodan_dns:
      api_key: ${env:SHODAN_API_KEY}
    subfinder:
      all: true
      recursive: false
      collect_sources: true
      timeout: 45
      max_time: 30
      rate_limit: 0
    virustotal:
      api_key: ${env:VT_API_KEY}
